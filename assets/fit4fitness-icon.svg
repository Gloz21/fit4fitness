<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fit4Fitness icon">
  <!-- Background circle (mint) -->
  <circle cx="512" cy="512" r="512" fill="#98FFB3"/>

  <!-- Dumbbells (subtle, behind) -->
  <g transform="translate(0,40) rotate(-20 512 512)" opacity="0.18">
    <rect x="120" y="420" width="220" height="90" rx="22" fill="#0A6B3A"/>
    <rect x="680" y="420" width="220" height="90" rx="22" fill="#0A6B3A"/>
    <rect x="320" y="440" width="80" height="50" rx="10" fill="#0A6B3A"/>
    <rect x="624" y="440" width="80" height="50" rx="10" fill="#0A6B3A"/>
  </g>

  <!-- Large '4' numeral -->
  <g>
    <text x="160" y="740" font-family="Arial, Helvetica, sans-serif" font-size="520" font-weight="700" fill="#042E1B">4</text>
  </g>

  <!-- Runner silhouette on top of the 4 -->
  <g transform="translate(0,-10)">
    <!-- head -->
    <circle cx="630" cy="350" r="30" fill="#042E1B"/>
    <!-- body/arm -->
    <path d="M600 380 C620 420, 660 420, 680 430" stroke="#042E1B" stroke-width="28" stroke-linecap="round" fill="none"/>
    <!-- torso -->
    <path d="M615 380 C610 430, 660 460, 670 500" stroke="#042E1B" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- front leg -->
    <path d="M680 520 C710 560, 740 620, 720 660" stroke="#042E1B" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- back leg -->
    <path d="M640 520 C610 560, 580 600, 560 640" stroke="#042E1B" stroke-width="26" stroke-linecap="round" fill="none"/>
  </g>

  <!-- App name (small) -->
  <text x="512" y="940" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#042E1B" text-anchor="middle">fit4fitness</text>
</svg>
